version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: surveillance_db
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-surveillance_db}
      POSTGRES_USER: ${POSTGRES_USER:-surveillance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U surveillance" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    container_name: surveillance_redis
    ports:
      - "6380:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: surveillance_backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-surveillance}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-surveillance_db}
      SECRET_KEY: ${SECRET_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      ENCRYPTION_SALT: ${ENCRYPTION_SALT}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./evidence:/app/evidence
      - ./models:/app/models
      - ./logs:/app/logs
    restart: unless-stopped

  # Surveillance System
  surveillance:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: surveillance_main
    command: [ "python", "main.py", "--video", "path/to/video.mp4" ]

    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-surveillance}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-surveillance_db}
      CAMERA_INDEX: ${CAMERA_INDEX:-0}
      MODEL_DIR: /app/models
    volumes:
      # - /dev/video0:/dev/video0  # Camera access (Linux only)
      - ./config:/app/config
      - ./known_person:/app/known_person
      - ./evidence:/app/evidence
      # devices:
      # - /dev/video0:/dev/video0  # Camera device (Linux only)
    restart: unless-stopped
    depends_on:
      - backend

  # Nginx Reverse Proxy (optional)
  nginx:
    image: nginx:alpine
    container_name: surveillance_nginx
    ports:
      - "8090:80"
      - "8443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

  # Database Dashboard (Adminer)
  adminer:
    image: adminer
    container_name: surveillance_adminer
    restart: always
    ports:
      - "8082:8080"
    depends_on:
      - db

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: surveillance_network
