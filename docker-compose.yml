# Aegis — full stack:   cp .env.example .env  (set secrets)  →  docker compose up -d --build
# Dashboard: http://localhost:${HTTP_PORT:-8080}

x-app: &app
  build: .
  image: aegis-app:latest
  env_file: .env
  init: true                  # main.py has no SIGTERM handler: without an init, stop waits 10 s
  environment: &app-env
    ENVIRONMENT: production
    HEADLESS: "true"          # containers have no display; .env may say false
    USE_SQLITE: "false"
    ALLOW_SQLITE_FALLBACK: "false"
    DATABASE_URL: postgresql://${POSTGRES_USER:-aegis}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-aegis}
    REDIS_URL: redis://redis:6379/0
    BACKEND_URL: http://backend:8000
    SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
    ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
    ENCRYPTION_SALT: ${ENCRYPTION_SALT:?set ENCRYPTION_SALT in .env}
    INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY in .env}
    CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
    COOKIE_SECURE: ${COOKIE_SECURE:-false}
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aegis}
      POSTGRES_USER: ${POSTGRES_USER:-aegis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    <<: *app
    command: ["api"]
    environment:
      <<: *app-env
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # The host's cameras, as listed by scripts/webcam_bridge.py (GET /devices).
      LOCAL_CAMERA_URL: ${LOCAL_CAMERA_URL:-http://host.docker.internal:8090/video}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - recordings:/app/data/recordings
      - ./models:/app/models
      - ./config:/app/config
      - ./data/watchlist:/app/data/watchlist:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5

  # AI workers. Containers cannot reach a laptop webcam: point cameras at RTSP/HTTP
  # sources in config/cameras.yaml (it is mounted, and re-read every few seconds).
  pipeline:
    <<: *app
    command: ["pipeline"]
    environment:
      <<: *app-env
      # Webcam index sources (source: 0) read the host webcam through
      # scripts/webcam_bridge.py on the host (started by scripts/docker-up.sh / .ps1).
      LOCAL_CAMERA_URL: ${LOCAL_CAMERA_URL:-http://host.docker.internal:8090/video}
      # Optional: process one file instead of cameras.yaml (e.g. a clip under data/demo).
      PIPELINE_VIDEO: ${PIPELINE_VIDEO:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      backend: { condition: service_healthy }
    volumes:
      - recordings:/app/data/recordings
      - ./models:/app/models
      - ./config:/app/config
      - ./data/watchlist:/app/data/watchlist:ro
      - ./data/demo:/app/data/demo:ro

  web:
    build:
      context: ./frontend
      args:
        # Optional demo button on the sign-in page (see DEMO_LOGIN_PASSWORD in .env.example).
        VITE_DEMO_USERNAME: ${DEMO_LOGIN_USERNAME:-demo}
        VITE_DEMO_PASSWORD: ${DEMO_LOGIN_PASSWORD:-}
    image: aegis-web:latest
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      backend: { condition: service_healthy }
    restart: unless-stopped

  # --- optional, by profile ---------------------------------------------------------------
  # HTTPS: docker compose --profile https up -d   (set DOMAIN, and COOKIE_SECURE=true in .env)
  proxy:
    image: caddy:2-alpine
    profiles: ["https"]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [web]
    restart: unless-stopped

  # Object storage for evidence and off-site backups: docker compose --profile storage up -d
  # then in .env: EVIDENCE_STORE=s3, S3_ENDPOINT_URL=http://minio:9000, S3_BUCKET=aegis-evidence,
  # S3_ACCESS_KEY / S3_SECRET_KEY = MINIO_ROOT_USER / _PASSWORD (or a narrower MinIO user),
  # S3_OBJECT_LOCK_DAYS=3650, BACKUP_S3_BUCKET=aegis-backups. In production put MinIO (or S3)
  # on other machines / disks than the API: a copy on the same disk is not a backup.
  minio:
    image: minio/minio:latest
    profiles: ["storage"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-aegis}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}   # set in .env (8+ chars) before using this profile
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9001:9001"      # console, local only
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  minio-init:                       # creates the buckets once: evidence with Object Lock (write-once)
    image: minio/mc:latest
    profiles: ["storage"]
    depends_on:
      minio: { condition: service_healthy }
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-aegis}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}   # set in .env (8+ chars) before using this profile
    entrypoint: >
      sh -c "mc alias set m http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
             mc mb --ignore-existing --with-lock m/aegis-evidence &&
             mc mb --ignore-existing --with-versioning m/aegis-backups &&
             mc ilm rule add --expire-days 90 m/aegis-backups || true"
    restart: "no"

volumes:
  caddy_data:
  minio_data:
  postgres_data:
  redis_data:
  recordings:

networks:
  default:
    name: aegis_network

