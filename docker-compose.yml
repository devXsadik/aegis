version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: surveillance_db
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-surveillance_db}
      POSTGRES_USER: ${POSTGRES_USER:-surveillance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U surveillance" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: surveillance_backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-surveillance}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-surveillance_db}
      SECRET_KEY: ${SECRET_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      ENCRYPTION_SALT: ${ENCRYPTION_SALT}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      BACKEND_URL: http://backend:8000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./evidence:/app/evidence
      - ./models:/app/models
      - ./config:/app/config
      - ./data/watchlist:/app/data/watchlist
      - ./data/recordings:/app/data/recordings
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-surveillance}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-surveillance_db}
      SECRET_KEY: ${SECRET_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      ENCRYPTION_SALT: ${ENCRYPTION_SALT}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      BACKEND_URL: http://backend:8000
      REDIS_URL: redis://redis:6379/0
    restart: unless-stopped

  surveillance:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: surveillance_main
    command: [ "python", "main.py", "--video", "data/demo/clips/sample.mp4" ]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-surveillance}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-surveillance_db}
      BACKEND_URL: http://backend:8000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      CAMERA_INDEX: ${CAMERA_INDEX:-0}
    volumes:
      - ./config:/app/config
      - ./data/watchlist:/app/data/watchlist
      - ./evidence:/app/evidence
      - ./data/demo:/app/data/demo
      - ./data/recordings:/app/data/recordings
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: surveillance_network

