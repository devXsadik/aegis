name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y cmake libgl1
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Tests (unit + integration, temp SQLite) with coverage gate
        env:
          SECRET_KEY: ci-secret-key-at-least-32-characters-long
          ENCRYPTION_KEY: ci-encryption-key-32-chars-minimum!!
          ENCRYPTION_SALT: ci-salt-value
          INTERNAL_API_KEY: ci-internal-key-not-default
          USE_SQLITE: "true"
        # Gate set just below the current 78%; raise it as coverage grows.
        run: pytest tests/ --tb=short --cov=backend --cov=core --cov=utils --cov-fail-under=75

  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: |
          sudo apt-get update && sudo apt-get install -y cmake libgl1
          pip install -r requirements-dev.txt
      - name: Alembic upgrade / check / downgrade on empty DB
        env:
          DATABASE_URL: sqlite:///./ci_migrate.db
          SECRET_KEY: ci-secret-key-at-least-32-characters-long
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # The dashboard against a throwaway API (scripts/e2e_server.py): sign in, triage, incident.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: |
          sudo apt-get update && sudo apt-get install -y cmake libgl1
          pip install -r requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - working-directory: frontend
        env:
          PYTHON: python
        run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results

  # Known-vulnerable dependencies, risky code patterns, leaked secrets, and the image's OS packages.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                    # gitleaks scans history too
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Python dependencies (pip-audit)
        run: |
          pip install pip-audit bandit
          # setuptools: torch caps it below the fixed release; it is only used to install packages,
          # never at run time. Remove these ignores when torch allows setuptools >= 84.1.
          pip-audit -r requirements.txt --progress-spinner off \
            --ignore-vuln PYSEC-2026-3447 --ignore-vuln GHSA-xmj3-9gf7-h52w
      - name: Python code (bandit, medium+ severity and confidence)
        run: bandit -q -r backend core utils -ll -ii -x tests
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dashboard dependencies (npm audit, high+)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: Secrets in the repository (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - name: Build the application image
        run: docker build -t aegis-app:ci .
      - name: Scan the image (Trivy, fail on fixable critical)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: aegis-app:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
