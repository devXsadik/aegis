name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y cmake libgl1
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Tests (unit + integration, temp SQLite) with coverage gate
        env:
          SECRET_KEY: ci-secret-key-at-least-32-characters-long
          ENCRYPTION_KEY: ci-encryption-key-32-chars-minimum!!
          ENCRYPTION_SALT: ci-salt-value
          INTERNAL_API_KEY: ci-internal-key-not-default
          USE_SQLITE: "true"
        # Gate set just below the current 48%; raise it as coverage grows.
        run: pytest tests/ --tb=short --cov=backend --cov=core --cov=utils --cov-fail-under=45

  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: |
          sudo apt-get update && sudo apt-get install -y cmake libgl1
          pip install -r requirements-dev.txt
      - name: Alembic upgrade / check / downgrade on empty DB
        env:
          DATABASE_URL: sqlite:///./ci_migrate.db
          SECRET_KEY: ci-secret-key-at-least-32-characters-long
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
