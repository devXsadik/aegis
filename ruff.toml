target-version = "py39"
extend-exclude = ["frontend", "alembic/versions"]

[lint]
select = ["F", "E9"]

[lint.per-file-ignores]
# Imports here register ORM models / relationships as a side effect.
"backend/db/database.py" = ["F401"]
"backend/models/*.py" = ["F401"]
"backend/init_db.py" = ["F401"]
"tests/conftest.py" = ["F401"]
