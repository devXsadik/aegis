# ============================================================
# AI Smart Surveillance System (Aegis) v5.0 — Configuration
# ============================================================

# --- Camera Source ---
camera_index: 0
# RTSP example (or set CAMERA_INDEX / RTSP_* in .env):
# camera_index: "rtsp://user:password@192.168.0.100:554/h264Preview_01_main"

camera_location: "Gate_1"
camera_name: "Main Gate Camera 1"
camera_lat: 23.8103
camera_lng: 90.4125
target_fps: 8
device: auto                       # auto | cpu | cuda:0 | mps

# --- Backend integration (pipeline → dashboard) ---
# Set BACKEND_URL and INTERNAL_API_KEY in .env

# --- Model Paths ---
model_dir: "models"
human_model: "yolov8n.pt"         # Nano model for speed
weapon_model: "weapon_yolo.pt"
# Vehicles (car, motorcycle, bus, truck):
#   fast     — the person model reports them in the same pass, next to no extra cost
#   accurate — a separate YOLOv8l (models/yolov8l.pt): better on small/far vehicles, ~2x detection time
#   off
vehicle_detection: fast

# --- Tracking ---
tracking:
  algorithm: deepsort              # deepsort | bytetrack (motion+IoU, keeps ids through occlusion, no embedding cost)
                                   # | botsort (bytetrack + camera-motion compensation; + re-ID with appearance: reid)
  appearance: histogram           # histogram (fast) | reid | cnn — reid/cnn too slow for CPU (~290 ms/frame)

# --- Pose (raised arms, fall suspicion) ---
pose:
  enabled: true
  every_n_frames: 2                # pose is the costliest per-frame step

# --- Action recognition (ST-GCN on pose keypoints: falling, staggering; not fighting, see action.py) ---
# Model: models/action_stgcn_ntu60.onnx (scripts/export_action_model.py). Needs pose enabled.
action:
  enabled: true
  window_seconds: 3.0              # keypoint history classified at once
  every_seconds: 1.0               # per person
  min_confidence: 0.6              # softmax probability needed to raise a reason

# --- Detection Thresholds ---
confidence_threshold: 0.4         # 0.5 dropped people who were partly hidden or far away
weapon_conf_threshold: 0.4
# Possible fight (core/analysis/fight.py): two people close together, both moving their arms fast,
# sustained over several pose passes. A heuristic, OFF until scripts/evaluate_accuracy.py on your
# own clips shows an acceptable false-alert rate (staged and real fights are both needed).
fight:
  enabled: false
  near: 1.3                        # how close: box centres within this many box-widths
  arm_speed: 1.6                   # wrist speed, in body-heights per second, for both people
  window: 6                        # pose passes looked at ...
  min_hits: 4                      # ... and how many of them must show it

# Scene events (core/analysis/scene_events.py). Heuristics: measure on your own clips first.
#   wrong_way        draw a zone of type "one_way" with the allowed direction in Zones; on when such a zone exists
#   abandoned_object backpacks / handbags / suitcases left alone (adds bag classes to the person pass)
#   crowd_surge      people in a zone at least double within the window (crush early warning)
scene_events:
  wrong_way:
    enabled: true
    max_angle: 120                 # degrees away from the allowed direction
    min_travel: 0.06               # share of the frame the vehicle must move before judging
  abandoned_object:
    enabled: false
    still_seconds: 60
    alone_seconds: 30
    owner_radius: 0.12             # share of the frame: a person this close still "has" the bag
  crowd_surge:
    enabled: false
    window_seconds: 60
    min_people: 10
    factor: 2.0

# Camera tamper alerts (core/analysis/tamper.py): covered, blurred, moved, frozen picture.
# Checked once a second on the raw frames. Tested on ~97 min of the dev webcams: no false alerts.
tamper:
  enabled: true
  persist: 5                       # seconds a condition must hold (covered, blurred)
  moved_persist: 10                # a new, steady view for this long = camera moved
  frozen_seconds: 60               # identical picture for this long = frozen
  dark_level: 18                   # mean brightness (0-255) below this = covered
  cooldown: 300                    # the same condition is reported again only after this

weapon:
  # Where the weapon model looks (core/detectors/weapon_detector.py). On CCTV a knife is 15-40 px:
  #   full         whole frame only (cheapest; misses small weapons)
  #   person_crop  each person cut out and enlarged to crop_size (weapons in hands at CCTV distance)
  #   both         full frame + person crops (default; one batched pass, ~1 + max_crops images)
  mode: full                       # switch to both only with a model trained on person crops (weapon_cctv.yaml)
  crop_size: 640
  max_crops: 4                     # people looked at closely per frame (most confident first)
  min_person_px: 40                # people shorter than this are too far away even enlarged
  # Before a weapon hit counts towards the 3-of-5-frames confirmation (core/analysis/weapon_confirm.py):
  min_box_side_px: 14              # smaller boxes are mostly guesses
  unheld_min_score: 0.65           # needed when the person's wrists are visible but away from it, or nobody holds it
  hand_reach: 0.25                 # "in hand": a wrist within this fraction of the person's height
face_tolerance: 0.45

# --- Recognition ---
rerecognize_every: 30              # Re-run face recognition every N frames per track

# --- Evidence & Alerts ---
evidence_throttle_seconds: 10.0
alarm_interval_seconds: 5.0
auto_alerts_enabled: true          # Auto-dispatch on criminal (all cameras → all channels)

# --- Criminal Watchlist ---
# Identities come only from the Face Registry (category=criminal, status wanted/convicted/suspect).

# --- Behavior Analysis ---
behavior:
  speed_threshold_mps: 3.0         # Metres/sec to flag as rapid movement (walking ~1.4, running > 3)
  loiter_radius_m: 0.6             # Staying within this radius counts as standing still
  loiter_seconds: 15               # Seconds before flagging as loitering
  erratic_angle: 60                # Degrees of direction change to count

# --- Anomaly Detection ---
anomaly:
  crowd_threshold: 5               # People in zone to trigger crowd anomaly
  dwell_seconds: 300               # Seconds in zone to trigger dwell anomaly

# --- Data Retention ---
# Runs nightly (MAINTENANCE_HOUR, default 03:00) with recording/capture cleanup and the backup.
# Expired evidence keeps its record and custody chain; only the images go. Evidence on an open
# or investigating incident is kept whole.
retention:
  enabled: true
  evidence_days: 90                # keep evidence images for N days
  archive_path: "evidence/archive" # a JSON note per purged item

# --- ANPR (opt-in; needs a plate detector for reliable results) ---
# Plate detector: models/plate_yolo.pt (train: python -m training.train_detector --config
# training/configs/plate.yaml, register --task plate_detect --weights pt, promote). With it, OCR
# reads only the plate crop (two lines joined); without it, OCR scans the whole vehicle.
# Bangladeshi plates are in Bangla: add "bn" to languages (EasyOCR downloads it on first use).
anpr:
  enabled: false
  languages:
    - "en"
  gpu: false
  plate_conf: 0.35

# --- Logging ---
logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/surveillance.log"
  max_bytes: 10485760              # 10 MB
  backup_count: 5


