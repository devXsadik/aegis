# Multi-Camera Configuration
# Each camera runs in its own thread when using: python main.py --multi
#
# source options:
#   0                    USB webcam index
#   rtsp://user:pass@IP:554/stream1   IP/CCTV camera
#   ${RTSP_GATE_1}       Read URL from .env (recommended for credentials)
#
# ONVIF PTZ (optional — physical pan/tilt/zoom):
#   onvif_host: "192.168.0.100"   or "http://192.168.0.100"
#   onvif_user / onvif_pass / onvif_profile

cameras:
  - id: gate_1
    name: "Main Gate Camera 1"
    source: 0
    # source: "${RTSP_GATE_1}"
    location: "Main Gate"
    lat: 23.8103
    lng: 90.4125
    enabled: true
    fps_limit: 15
    priority: high
    # onvif_host: "${ONVIF_GATE_1_HOST}"
    # onvif_user: "${ONVIF_GATE_1_USER}"
    # onvif_pass: "${ONVIF_GATE_1_PASS}"
    # onvif_profile: "Profile_1"

  - id: parking_1
    name: "Parking Lot A"
    source: "${RTSP_PARKING_1}"
    location: "Parking A"
    lat: 23.8105
    lng: 90.4127
    enabled: false
    fps_limit: 10
    priority: medium

  - id: lobby_1
    name: "Main Lobby"
    source: "${RTSP_LOBBY_1}"
    location: "Lobby"
    lat: 23.8104
    lng: 90.4126
    enabled: false
    fps_limit: 15
    priority: high
