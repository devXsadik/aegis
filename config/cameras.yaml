# ============================================================
# Multi-Camera Configuration
# ============================================================
# Define all camera feeds for the surveillance system.
# Each camera runs in its own processing thread.

cameras:
  - id: gate_1
    name: "Main Gate Camera 1"
    source: 0                          # Webcam index or RTSP URL
    # source: "rtsp://admin:pass@192.168.0.100:554/stream1"
    location: "Main Gate"
    lat: 23.8103                       # GPS latitude (for map view)
    lng: 90.4125                       # GPS longitude (for map view)
    enabled: true
    fps_limit: 15                      # Max FPS to process
    priority: high                     # high | medium | low (GPU scheduling)

