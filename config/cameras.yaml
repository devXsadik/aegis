# Multi-Camera Configuration
# Each camera runs in its own thread when using: python main.py --multi
#
# source options:
#   0                    USB webcam index
#   rtsp://user:pass@IP:554/stream1   IP/CCTV camera
#   ${RTSP_GATE_1}       Read URL from .env (recommended for credentials)
#
# ONVIF PTZ (optional — physical pan/tilt/zoom):
#   onvif_host: "192.168.0.100"   or "http://192.168.0.100"
#   onvif_user / onvif_pass / onvif_profile

cameras:
  - id: laptop
    name: "Laptop Camera"
    source: 0
    location: "Local"
    enabled: true
    fps_limit: 8
    priority: high

  - id: tarik
    name: "tarik camera"
    source: "http://192.168.1.3:8080/video"
    location: "Local"
    enabled: true
    fps_limit: 8

  - id: tarik_tab
    name: "tarik tab"
    source: "http://192.168.1.6:8080/video"
    location: "Local"
    enabled: true
    fps_limit: 8

  - id: mobile
    name: "Mobile IP Camera"
    source: "http://192.168.0.103:8080/video"
    location: "Mobile"
    enabled: true
    fps_limit: 8
    priority: high
