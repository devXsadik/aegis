# Multi-Camera Configuration
# Each camera runs in its own thread when using: python main.py --multi
#
# source options:
#   0                    USB webcam index
#   rtsp://user:pass@IP:554/stream1   IP/CCTV camera
#   ${RTSP_GATE_1}       Read URL from .env (recommended for credentials)
#
# ONVIF PTZ (optional — physical pan/tilt/zoom):
#   onvif_host: "192.168.0.100"   or "http://192.168.0.100"
#   onvif_user / onvif_pass / onvif_profile

cameras:
  - id: gate_1
    name: "Main Gate Camera 1"
    source: 0
    location: "Gate_1"
    lat: 23.8103
    lng: 90.4125
    enabled: true
    fps_limit: 8
    priority: high

  - id: laptop
    name: "Laptop Camera"
    source: 0
    location: "Local"
    enabled: true
    fps_limit: 8
    priority: high

  - id: tarik
    name: "tarik camera"
    source: "http://192.168.1.3:8080/video"
    location: "Local"
    enabled: true
    fps_limit: 8

  - id: tarik_tab
    name: "tarik tab"
    source: "http://192.168.1.6:8080/video"
    location: "Local"
    enabled: true
    fps_limit: 8

  - id: mobile
    name: "Mobile IP Camera"
    source: "http://192.168.0.103:8080/video"
    location: "Mobile"
    enabled: true
    fps_limit: 8
    priority: high

  - id: fahim_camera
    name: "fahim camera"
    source: "http://192.168.0.101:8080/video"
    location: "uttara sector 9"
    enabled: true
    fps_limit: 8


# Optional per-camera analytics geometry (normalized 0-1 coordinates), e.g.:
#   - id: gate_1
#     zones:
#       - {name: door, type: restricted, polygon: [[0.1,0.2],[0.4,0.2],[0.4,0.9],[0.1,0.9]]}
#     lines:
#       - {name: entrance, p1: [0.5, 0.0], p2: [0.5, 1.0]}
# With no zones, the frame is split into four quadrants (crowd/dwell only).
# Zones drawn in the dashboard (Zones & Lines page) are stored in the database and take
# precedence over this file once saved; cameras apply changes within ~30 s.
