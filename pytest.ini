[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py
python_functions = test_*
python_classes = Test*

addopts = -v --tb=short

markers =
    unit: Unit tests (no external dependencies)
    integration: Integration tests (requires DB/models)
    slow: Slow tests (model loading, etc.)


# A deprecation raised by our own code fails the run (fix it while it is one line);
# third-party ones (jose, starlette, face_recognition_models) only warn.
filterwarnings =
    error::DeprecationWarning:backend
    error::DeprecationWarning:core
    error::DeprecationWarning:utils
