<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Surveillance Dashboard</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'SF Mono', 'Consolas', monospace; background: #0a0a0a; color: #0f0; display: flex; height: 100vh; overflow: hidden; }
  #sidebar { width: 260px; background: #111; border-right: 1px solid #1a3a1a; padding: 16px; display: flex; flex-direction: column; flex-shrink: 0; }
  #sidebar h1 { font-size: 13px; color: #0f0; margin-bottom: 14px; letter-spacing: 2px; text-transform: uppercase; border-bottom: 1px solid #1a3a1a; padding-bottom: 8px; }
  #sidebar .stat { padding: 6px 0; border-bottom: 1px solid #0a1a0a; font-size: 12px; display: flex; justify-content: space-between; }
  #sidebar .stat .label { color: #555; }
  #sidebar .stat .value { color: #0f0; font-weight: bold; }
  .critical { color: #f00 !important; }
  .warning { color: #ff8800 !important; }
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #header { background: #0d0d0d; padding: 10px 20px; border-bottom: 1px solid #1a3a1a; display: flex; justify-content: space-between; align-items: center; }
  #header h2 { font-size: 13px; letter-spacing: 1px; text-transform: uppercase; }
  #header .status { font-size: 11px; color: #555; }
  #header .status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .dot.green { background: #0f0; }
  .dot.red { background: #f00; }
  .dot.yellow { background: #ff0; }
  #content { flex: 1; display: flex; padding: 12px; gap: 12px; overflow: hidden; }
  #alerts-panel { flex: 1; background: #0d0d0d; border: 1px solid #1a3a1a; border-radius: 4px; overflow-y: auto; min-width: 0; }
  #alerts-panel h3 { padding: 8px 12px; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: #555; border-bottom: 1px solid #1a3a1a; }
  .alert-item { padding: 8px 12px; border-bottom: 1px solid #0a1a0a; font-size: 12px; cursor: pointer; }
  .alert-item:hover { background: #141414; }
  .alert-item .time { color: #555; font-size: 10px; }
  .alert-item .type { font-weight: bold; margin: 2px 0; }
  .alert-item .loc { color: #888; font-size: 11px; }
  #camera-section { width: 420px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  #camera-list-panel { background: #0d0d0d; border: 1px solid #1a3a1a; border-radius: 4px; max-height: 200px; overflow-y: auto; }
  #camera-list-panel h3 { padding: 8px 12px; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: #555; border-bottom: 1px solid #1a3a1a; }
  .cam-item { padding: 6px 12px; border-bottom: 1px solid #0a1a0a; font-size: 11px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
  .cam-item:hover { background: #141414; }
  .cam-item.active { background: #1a3a1a; border-left: 3px solid #0f0; }
  .cam-item .name { font-weight: bold; }
  .cam-item .meta { color: #555; font-size: 10px; }
  .cam-item .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 4px; }
  #preview-panel { background: #0d0d0d; border: 1px solid #1a3a1a; border-radius: 4px; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 300px; position: relative; }
  #preview-panel .placeholder { color: #333; font-size: 13px; letter-spacing: 1px; }
  #preview-panel img { max-width: 100%; max-height: 100%; object-fit: contain; }
  #preview-info { position: absolute; bottom: 8px; left: 12px; font-size: 10px; color: #888; }
  .btn { background: #1a3a1a; border: 1px solid #0f0; color: #0f0; padding: 4px 12px; font-size: 11px; cursor: pointer; border-radius: 2px; font-family: inherit; }
  .btn:hover { background: #0f0; color: #000; }
  .btn.danger { border-color: #f00; color: #f00; }
  .btn.danger:hover { background: #f00; color: #fff; }
  .tab-bar { display: flex; gap: 0; border-bottom: 1px solid #1a3a1a; margin-bottom: 8px; }
  .tab { padding: 6px 12px; font-size: 10px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; color: #555; border: none; background: none; font-family: inherit; }
  .tab:hover { color: #0f0; }
  .tab.active { color: #0f0; border-bottom: 2px solid #0f0; }
  .tab-content { display: none; font-size: 12px; }
  .tab-content.active { display: block; }
  #toast { position: fixed; bottom: 20px; right: 20px; background: #111; border: 1px solid #1a3a1a; padding: 12px 16px; font-size: 12px; border-radius: 4px; display: none; max-width: 400px; z-index: 100; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: #0a0a0a; }
  ::-webkit-scrollbar-thumb { background: #1a3a1a; border-radius: 3px; }
</style>
</head>
<body>
<div id="sidebar">
  <h1>Surveillance OS</h1>
  <div class="stat"><span class="label">System</span><span class="value" id="sys-status">...</span></div>
  <div class="stat"><span class="label">CPU</span><span class="value" id="sys-cpu">--</span></div>
  <div class="stat"><span class="label">Memory</span><span class="value" id="sys-mem">--</span></div>
  <div class="stat"><span class="label">Uptime</span><span class="value" id="sys-uptime">--</span></div>
  <div class="stat"><span class="label">Cameras</span><span class="value" id="cam-count">0</span></div>
  <div class="stat"><span class="label">Active Alerts</span><span class="value critical" id="alert-count">0</span></div>
  <div class="stat"><span class="label">Detections (24h)</span><span class="value" id="det-total">0</span></div>
  <div class="stat"><span class="label">Criminals</span><span class="value critical" id="det-criminal">0</span></div>
  <div class="stat"><span class="label">Weapons</span><span class="value warning" id="det-weapon">0</span></div>
  <div class="stat"><span class="label">Vehicles</span><span class="value" id="det-vehicle">0</span></div>
  <div class="stat"><span class="label">Watchlist</span><span class="value critical" id="watchlist-count">0</span></div>
  <div style="margin-top: auto; padding-top: 12px; border-top: 1px solid #1a3a1a; display: flex; gap: 6px;">
    <button class="btn" onclick="refreshSummary()" style="flex:1">Refresh</button>
    <button class="btn danger" onclick="ackAll()" style="flex:1">Ack All</button>
  </div>
</div>
<div id="main">
  <div id="header">
    <h2>Live Alert Feed</h2>
    <div class="status">
      <span class="dot green" id="ws-dot"></span>
      <span id="ws-status">Connected</span>
    </div>
  </div>
  <div id="content">
    <div style="flex:1;display:flex;flex-direction:column;min-width:0;">
      <div class="tab-bar">
        <button class="tab active" onclick="switchTab('alerts',this)">Alerts</button>
        <button class="tab" onclick="switchTab('watchlist',this)">Watchlist</button>
      </div>
      <div id="tab-alerts" class="tab-content active">
        <div id="alerts-panel" style="flex:1;border:none;border-radius:0;">
          <div id="alert-list"></div>
        </div>
      </div>
      <div id="tab-watchlist" class="tab-content">
        <div style="padding:8px 0;font-size:12px;color:#555;">Wanted persons in database</div>
        <div id="watchlist-items"></div>
      </div>
    </div>
    <div id="camera-section">
      <div id="camera-list-panel">
        <h3>Cameras <span style="color:#555;font-weight:normal">(click to view)</span></h3>
        <div id="cam-list"></div>
      </div>
      <div id="preview-panel">
        <div class="placeholder" id="preview-placeholder">◉ Select a camera</div>
        <img id="preview-img" style="display:none">
        <div id="preview-info"></div>
      </div>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
const API = `${window.location.protocol}//${window.location.host}`;
let ws = null;
let selectedCam = null;
let healthInterval = null;

function connectWS() {
  const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${proto}//${window.location.host}/cameras/ws/alerts`);
  ws.onopen = () => {
    document.getElementById('ws-dot').className = 'dot green';
    document.getElementById('ws-status').textContent = 'Connected';
  };
  ws.onclose = () => {
    document.getElementById('ws-dot').className = 'dot red';
    document.getElementById('ws-status').textContent = 'Disconnected (reconnecting...)';
    setTimeout(connectWS, 3000);
  };
  ws.onmessage = (e) => {
    try { const d = JSON.parse(e.data); addAlert(d); } catch(_) {}
  };
}

function switchTab(name, btn) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-' + name).classList.add('active');
  if (name === 'watchlist') loadWatchlist();
}

async function loadWatchlist() {
  try {
    const r = await fetch(`${API}/faces/watchlist`);
    const items = await r.json();
    const list = document.getElementById('watchlist-items');
    list.innerHTML = '';
    items.forEach(p => {
      const el = document.createElement('div');
      el.className = 'alert-item';
      const tl = p.threat_level >= 7 ? 'critical' : p.threat_level >= 4 ? 'warning' : '';
      el.innerHTML = `<div class="type">${p.name}</div><div class="loc">${p.category||'Unknown'} | Threat: <span class="${tl}">${p.threat_level}/10</span></div>`;
      list.appendChild(el);
    });
    document.getElementById('watchlist-count').textContent = items.length;
  } catch(e) {}
}

function addAlert(data) {
  const list = document.getElementById('alert-list');
  const el = document.createElement('div');
  el.className = 'alert-item';
  const sev = data.severity === 'high' ? 'critical' : data.severity === 'medium' ? 'warning' : '';
  el.innerHTML = `
    <div class="time">${data.timestamp || new Date().toISOString()} | <span class="${sev}">${(data.severity||'info').toUpperCase()}</span></div>
    <div class="type">${data.alert_type || 'ALERT'}</div>
    <div class="loc">${data.data?.camera_location || data.camera_location || ''} ${data.data?.criminal_name ? '| ' + data.data.criminal_name : ''}</div>
  `;
  el.onclick = () => ackAlert(data.id || 0, el);
  list.prepend(el);
  if (list.children.length > 200) list.lastChild.remove();
  toast('Alert: ' + (data.alert_type || 'Unknown'));
}

async function ackAlert(id, el) {
  try {
    await fetch(`${API}/alerts/${id}/acknowledge`, { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify({acknowledged:true}) });
    if (el) el.style.opacity = '0.4';
    toast('Acknowledged');
  } catch(e) { toast('Ack failed'); }
}

async function ackAll() {
  try {
    const r = await fetch(`${API}/alerts/unacknowledged`);
    const alerts = await r.json();
    for (const a of alerts) {
      await fetch(`${API}/alerts/${a.id}/acknowledge`, { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify({acknowledged:true}) });
    }
    toast(`${alerts.length} acknowledged`);
    loadAlerts(); refreshSummary();
  } catch(e) { toast('Ack all failed'); }
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(t._hide); t._hide = setTimeout(() => t.style.display = 'none', 3000);
}

async function loadAlerts() {
  try {
    const r = await fetch(`${API}/alerts/?limit=50&acknowledged=false&dismissed=false`);
    const alerts = await r.json();
    const list = document.getElementById('alert-list');
    list.innerHTML = '';
    alerts.forEach(a => {
      const el = document.createElement('div');
      el.className = 'alert-item';
      const sev = a.severity === 'high' ? 'critical' : a.severity === 'medium' ? 'warning' : '';
      el.innerHTML = `<div class="time">${a.timestamp} | <span class="${sev}">${(a.severity||'info').toUpperCase()}</span></div><div class="type">${a.alert_type}</div><div class="loc">${a.camera_location||''} ${a.person_name ? '| '+a.person_name : ''}</div>`;
      el.onclick = () => ackAlert(a.id, el);
      list.appendChild(el);
    });
    document.getElementById('alert-count').textContent = alerts.length;
  } catch(e) {}
}

function selectCamera(cam) {
  selectedCam = cam;
  document.querySelectorAll('.cam-item').forEach(el => el.classList.remove('active'));
  const activeEl = document.querySelector(`.cam-item[data-id="${cam.camera_id}"]`);
  if (activeEl) activeEl.classList.add('active');

  const placeholder = document.getElementById('preview-placeholder');
  const img = document.getElementById('preview-img');
  const info = document.getElementById('preview-info');

  if (cam.uri && cam.active) {
    placeholder.style.display = 'none';
    img.style.display = 'block';
    img.src = `${API}/cameras/${cam.camera_id}/mjpeg?_t=${Date.now()}`;
    info.textContent = `${cam.name || cam.camera_id} | ${cam.location || ''}`;
    startHealthPoll(cam.camera_id);
  } else {
    placeholder.style.display = 'block';
    placeholder.textContent = cam.active ? '◉ Connecting...' : '◉ Camera offline';
    img.style.display = 'none';
    info.textContent = '';
    stopHealthPoll();
  }
}

function startHealthPoll(camId) {
  stopHealthPoll();
  healthInterval = setInterval(async () => {
    try {
      const r = await fetch(`${API}/cameras/${camId}/health`);
      const h = await r.json();
      const info = document.getElementById('preview-info');
      if (h.connected) {
        info.textContent = `${h.width}x${h.height} @ ${h.fps||'?'}fps | ${h.connection_time_ms}ms`;
      } else {
        info.textContent = 'Stream offline';
      }
    } catch(e) {}
  }, 5000);
}

function stopHealthPoll() {
  if (healthInterval) { clearInterval(healthInterval); healthInterval = null; }
}

async function loadCameras() {
  try {
    const r = await fetch(`${API}/cameras/`);
    const cams = await r.json();
    const list = document.getElementById('cam-list');
    list.innerHTML = '';
    cams.forEach(c => {
      const el = document.createElement('div');
      el.className = 'cam-item';
      el.dataset.id = c.camera_id;
      const dotClass = c.active ? 'green' : 'red';
      el.innerHTML = `<span><span class="dot ${dotClass}"></span><span class="name">${c.name || c.camera_id}</span> <span class="meta">${c.location||''}</span></span><span class="meta">${c.status}</span>`;
      el.onclick = () => selectCamera(c);
      list.appendChild(el);
    });
    document.getElementById('cam-count').textContent = cams.length;
    if (!selectedCam && cams.length > 0) selectCamera(cams[0]);
  } catch(e) {}
}

async function refreshHealth() {
  try {
    const r = await fetch(`${API}/system/health`);
    const h = await r.json();
    document.getElementById('sys-cpu').textContent = h.cpu_percent + '%';
    document.getElementById('sys-mem').textContent = h.memory_percent + '%';
    document.getElementById('sys-uptime').textContent = h.uptime;
  } catch(e) {}
}

async function refreshSummary() {
  try {
    const r = await fetch(`${API}/analytics/summary?days=1`);
    const s = await r.json();
    document.getElementById('det-total').textContent = s.total_detections || 0;
    document.getElementById('det-criminal').textContent = s.criminals_detected || 0;
    document.getElementById('det-weapon').textContent = s.weapons_detected || 0;
    document.getElementById('det-vehicle').textContent = s.vehicles_detected || 0;
    document.getElementById('sys-status').textContent = 'Online';
  } catch(e) {
    document.getElementById('sys-status').textContent = 'Offline';
    document.getElementById('sys-status').style.color = '#f00';
  }
}

loadAlerts(); loadCameras(); refreshSummary(); refreshHealth(); loadWatchlist();
connectWS();
setInterval(loadAlerts, 10000);
setInterval(loadCameras, 30000);
setInterval(refreshSummary, 60000);
setInterval(refreshHealth, 15000);
setInterval(loadWatchlist, 60000);
</script>
</body>
</html>
